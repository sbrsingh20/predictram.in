<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkYC Process - Step 2</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function verifyDetails() {
            const pan = document.getElementById('pan').value;
            const aadhar = document.getElementById('aadhar').value;

            // Validate PAN and Aadhar number (simple format validation)
            const panPattern = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;
            const aadharPattern = /^\d{12}$/;

            if (panPattern.test(pan) && aadharPattern.test(aadhar)) {
                localStorage.setItem('pan', pan);
                localStorage.setItem('aadhar', aadhar);
                window.location.href = 'verification.html';
            } else {
                alert('Please enter valid PAN and AADHAR numbers.');
            }
        }
    </script>
</head>
<body>
    <h1>EkYC Process - Step 2</h1>
    <form onsubmit="event.preventDefault(); verifyDetails();">
        <label for="pan">PAN Number:</label>
        <input type="text" id="pan" required><br><br>

        <label for="aadhar">AADHAR Number:</label>
        <input type="text" id="aadhar" required><br><br>

        <button type="submit">Verify</button>
    </form>
</body>
</html>
